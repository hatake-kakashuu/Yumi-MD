<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumi Bot - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-pink: #ff69b4;
            --primary-purple: #9d4edd;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 105, 180, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(157, 78, 221, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 105, 180, 0.1);
        }

        .header {
            margin-bottom: 30px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--primary-pink);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
            object-fit: cover;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .status-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-sub);
            box-shadow: 0 0 8px var(--text-sub);
        }

        .qr-area {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 260px;
            height: 260px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        #qr-canvas {
            display: none;
            border-radius: 12px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 105, 180, 0.1);
            border-top: 3px solid var(--primary-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .success-icon {
            display: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--accent-green);
            justify-content: center;
            align-items: center;
            color: var(--accent-green);
            font-size: 2.5rem;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .instructions {
            text-align: left;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .instructions h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-main);
        }

        .instructions ol {
            list-style-position: inside;
            color: var(--text-sub);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .instructions li {
            margin-bottom: 6px;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .status-open {
            color: var(--accent-green) !important;
            background: rgba(16, 185, 129, 0.1) !important;
            border-color: rgba(16, 185, 129, 0.2) !important;
        }
        .status-open .status-dot {
            background-color: var(--accent-green) !important;
            box-shadow: 0 0 10px var(--accent-green) !important;
            animation: pulse 1.5s infinite;
        }

        .status-connecting {
            color: var(--primary-pink) !important;
            background: rgba(255, 105, 180, 0.1) !important;
            border-color: rgba(255, 105, 180, 0.2) !important;
        }
        .status-connecting .status-dot {
            background-color: var(--primary-pink) !important;
            box-shadow: 0 0 10px var(--primary-pink) !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <img class="logo-img" src="https://i.pinimg.com/736x/df/e9/fc/dfe9fccb5145db766c473325f07a77ea.jpg" alt="Yumi Logo">
                <h1 id="bot-title">YUMI BOT</h1>
                <p class="subtitle" id="status-desc">Initializing connection...</p>
            </div>

            <div class="status-container" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Connecting</span>
            </div>

            <div class="qr-area" id="qr-area">
                <div class="spinner" id="qr-spinner"></div>
                <div class="success-icon" id="success-icon">✓</div>
                <canvas id="qr-canvas"></canvas>
            </div>

            <div class="instructions" id="instructions-box">
                <h3>Scan QR Code to Connect:</h3>
                <ol>
                    <li>Open WhatsApp on your phone.</li>
                    <li>Tap <b>Menu</b> or <b>Settings</b> and select <b>Linked Devices</b>.</li>
                    <li>Tap <b>Link a Device</b>.</li>
                    <li>Point your phone screen to this QR Code to scan it.</li>
                </ol>
            </div>
        </div>

        <div class="footer">
            Yumi Bot Dashboard &copy; 2026. Made with 🌸 for WhatsApp.
        </div>
    </div>

    <script>
        let currentStatus = null;
        let qrGenerator = null;

        function updateStatus() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    const statusBadge = document.getElementById('status-badge');
                    const statusText = document.getElementById('status-text');
                    const statusDesc = document.getElementById('status-desc');
                    const qrSpinner = document.getElementById('qr-spinner');
                    const qrCanvas = document.getElementById('qr-canvas');
                    const successIcon = document.getElementById('success-icon');
                    const instructionsBox = document.getElementById('instructions-box');
                    const botTitle = document.getElementById('bot-title');

                    if (data.botName) {
                        botTitle.innerText = data.botName.toUpperCase() + " BOT";
                    }

                    statusBadge.className = 'status-container';

                    if (data.status === 'open') {
                        statusBadge.classList.add('status-open');
                        statusText.innerText = 'Connected';
                        statusDesc.innerText = 'Bot is active and running!';
                        
                        qrSpinner.style.display = 'none';
                        qrCanvas.style.display = 'none';
                        successIcon.style.display = 'flex';
                        instructionsBox.style.display = 'none';
                    } else {
                        successIcon.style.display = 'none';
                        
                        if (data.qr) {
                            statusBadge.classList.add('status-connecting');
                            statusText.innerText = 'Scan QR';
                            statusDesc.innerText = 'Waiting for WhatsApp pairing...';
                            instructionsBox.style.display = 'block';
                            
                            qrSpinner.style.display = 'none';
                            qrCanvas.style.display = 'block';

                            if (!qrGenerator) {
                                qrGenerator = new QRious({
                                    element: qrCanvas,
                                    value: data.qr,
                                    size: 220,
                                    background: '#ffffff',
                                    foreground: '#000000',
                                    level: 'H'
                                });
                            } else {
                                qrGenerator.value = data.qr;
                            }
                        } else {
                            statusText.innerText = 'Loading';
                            statusDesc.innerText = 'Preparing pairing session...';
                            instructionsBox.style.display = 'block';
                            qrSpinner.style.display = 'block';
                            qrCanvas.style.display = 'none';
                        }
                    }
                })
                .catch(err => {
                    console.error('Error fetching bot status:', err);
                });
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
